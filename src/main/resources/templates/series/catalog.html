<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Заголовок страницы -->
    <title>Каталог — Сериалы на ЧД</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<nav class="navbar">
    <div class="nav-inner">
        <!-- Логотип в шапке -->
        <a th:href="@{/}" class="logo">СЕРИАЛЫ<span>НА ЧД</span></a>
        <div class="nav-links">
            <a th:href="@{/series}" class="active">Каталог</a>
        </div>
        <div class="nav-auth">
            <div sec:authorize="isAnonymous()">
                <a th:href="@{/auth/login}" class="btn btn-ghost">Войти</a>
                <a th:href="@{/auth/register}" class="btn btn-primary">Регистрация</a>
            </div>
            <div sec:authorize="isAuthenticated()" class="user-menu">
                <span class="username" sec:authentication="name"></span>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="btn btn-ghost admin-link">Админ</a>
                <form th:action="@{/auth/logout}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-ghost">Выйти</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="page-header">
    <div class="container">
        <!-- Главный заголовок каталога -->
        <h1>Каталог «Сериалы на ЧД»</h1>
    </div>
</div>

<div class="container catalog-layout">
    <!-- Filters -->
    <aside class="filters">
        <form th:action="@{/series}" method="get">
            <div class="filter-group">
                <label>Поиск</label>
                <input type="text" name="search" th:value="${search}"
                       placeholder="Название сериала..." class="input">
            </div>
            <div class="filter-group">
                <label>Жанр</label>
                <select name="genre" class="input">
                    <option value="">Все жанры</option>
                    <option th:each="g : ${genres}" th:value="${g}" th:text="${g}"
                            th:selected="${g == selectedGenre}">Жанр</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-full">Применить</button>
            <a th:href="@{/series}" class="btn btn-ghost w-full" style="margin-top:8px">Сбросить</a>
        </form>
    </aside>

    <!-- Results -->
    <div class="catalog-content">
        <div class="results-info">
            <!-- Текст о количестве найденных элементов -->
            <span th:text="${seriesPage.totalElements + ' сериалов в ЧД'}">0 сериалов</span>
        </div>

        <div class="cards-grid" th:if="${!seriesPage.isEmpty()}">
            <div th:each="series : ${seriesPage.content}" class="card">
                <a th:href="@{/series/{id}(id=${series.id})}">
                    <div class="card-poster">
                        <img th:src="${series.posterUrl != null ? series.posterUrl : '/images/placeholder.jpg'}"
                             th:alt="${series.title}" loading="lazy">
                        <div class="card-badge" th:if="${series.imdbRating != null}">
                            ★ <span th:text="${#numbers.formatDecimal(series.imdbRating, 1, 1)}">0.0</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title" th:text="${series.title}">Название</h3>
                        <div class="card-meta">
                            <span th:text="${series.genre}">Жанр</span>
                            <span th:text="${series.year}">2024</span>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <div class="empty-state" th:if="${seriesPage.isEmpty()}">
            <p>В каталоге ЧД пока ничего не нашлось. Попробуйте изменить фильтры.</p>
        </div>

        <!-- Pagination -->
        <div class="pagination" th:if="${seriesPage.totalPages > 1}">
            <a th:href="@{/series(search=${search}, genre=${selectedGenre}, page=${seriesPage.number - 1})}"
               th:class="${seriesPage.first} ? 'page-btn disabled' : 'page-btn'"
               th:unless="${seriesPage.first}">← Назад</a>

            <span th:each="i : ${#numbers.sequence(0, seriesPage.totalPages - 1)}">
                <a th:href="@{/series(search=${search}, genre=${selectedGenre}, page=${i})}"
                   th:text="${i + 1}"
                   th:class="${i == seriesPage.number} ? 'page-btn active' : 'page-btn'">1</a>
            </span>

            <a th:href="@{/series(search=${search}, genre=${selectedGenre}, page=${seriesPage.number + 1})}"
               th:unless="${seriesPage.last}"
               class="page-btn">Вперёд →</a>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="footer-inner">
        <!-- Логотип в футере -->
        <span class="logo">СЕРИАЛЫ<span>НА ЧД</span></span>
        <p>© 2026 Сериалы на ЧД</p>
    </div>
</footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>

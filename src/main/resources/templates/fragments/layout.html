<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle != null ? pageTitle + ' — Сериалы на ЧД' : 'Сериалы на ЧД'}">Series on Black Day</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<nav class="navbar">
    <div class="nav-inner">

        <a th:href="@{/}" class="logo">Series on <span>Black Day</span></a>
        <div class="nav-links">
            <a th:href="@{/series}">Каталог</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/profile}">Профиль</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="admin-link">Админ</a>
        </div>
        <div class="nav-auth">
            <div sec:authorize="isAnonymous()">
                <a th:href="@{/auth/login}" class="btn btn-ghost">Войти</a>
                <a th:href="@{/auth/register}" class="btn btn-primary">Регистрация</a>
            </div>
            <div sec:authorize="isAuthenticated()" class="user-menu">
                <span class="username" sec:authentication="name"></span>
                <form th:action="@{/auth/logout}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-ghost">Выйти</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<main th:fragment="content">

</main>

<footer class="footer">
    <div class="footer-inner">

        <span class="logo">Series on <span>Black Day</span></span>

    </div>
</footer>

<script th:src="@{/js/main.js}"></script>
</body>
</html>

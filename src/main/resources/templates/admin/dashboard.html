<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Админ панель</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<nav class="navbar">
    <div class="nav-inner">

        <a th:href="@{/}" class="logo">Сериалы на <span>ЧД</span></a>
        <div class="nav-links">
            <a th:href="@{/series}">Каталог</a>
            <a th:href="@{/admin}" class="active admin-link">Админ</a>
        </div>
        <div class="nav-auth">
            <form th:action="@{/auth/logout}" method="post">
                <button type="submit" class="btn btn-ghost">Выйти</button>
            </form>
        </div>
    </div>
</nav>



<div class="container" style="padding-top: 40px;">
    <div class="admin-header">
        <h1>Управление контентом</h1>
        <a th:href="@{/admin/series/new}" class="btn btn-primary">+ Добавить сериал</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <div class="admin-table-wrap">
        <table class="admin-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Жанр</th>
                <th>Год</th>
                <th>Рейтинг</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="series : ${seriesList}">
                <td th:text="${series.id}">1</td>
                <td>

                    <a th:href="@{/series/{id}(id=${series.id})}" th:text="${series.title}">Название</a>
                </td>
                <td th:text="${series.genre}">Жанр</td>
                <td th:text="${series.year}">2026</td>
                <td th:text="${series.imdbRating}">0.0</td>
                <td><span class="status-badge" th:text="${series.status}">ONGOING</span></td>
                <td class="admin-actions">
                    <a th:href="@{/admin/series/{id}/edit(id=${series.id})}" class="btn btn-sm btn-ghost">✏ Ред.</a>
                    <form th:action="@{/admin/series/{id}/delete(id=${series.id})}" method="post" style="display:inline"
                          onsubmit="return confirm('Удалить сериал из базы?')">
                        <button type="submit" class="btn btn-sm btn-danger">✕ Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>

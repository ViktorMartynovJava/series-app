<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сериалы на ЧД — Сериалы на каждый день</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<nav class="navbar">
    <div class="nav-inner">
        <a th:href="@{/}" class="logo">Сериалы на<span>ЧД</span></a>
        <div class="nav-links">
            <a th:href="@{/series}">Каталог</a>
        </div>
        <div class="nav-auth">
            <div sec:authorize="isAnonymous()">
                <a th:href="@{/auth/login}" class="btn btn-ghost">Войти</a>
                <a th:href="@{/auth/register}" class="btn btn-primary">Регистрация</a>
            </div>
            <div sec:authorize="isAuthenticated()" class="user-menu">
                <span class="username" sec:authentication="name"></span>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="btn btn-ghost admin-link">Админ</a>
                <form th:action="@{/auth/logout}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-ghost">Выйти</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
        <h1>Лучшие сериалы<br><span>по моей личной рекомендации</span></h1>
        <p>Тысячи сериалов, рейтинги, отзывы и рекомендации</p>
        <a th:href="@{/series}" class="btn btn-primary btn-lg">Смотреть каталог</a>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="section-header">
            <h2>Топ по рейтингу</h2>
            <a th:href="@{/series}" class="link-all">Все сериалы →</a>
        </div>
        <div class="cards-grid">
            <div th:each="series : ${topRated}" class="card">
                <a th:href="@{/series/{id}(id=${series.id})}">
                    <div class="card-poster">
                        <img th:src="${series.posterUrl != null ? series.posterUrl : '/images/placeholder.jpg'}"
                             th:alt="${series.title}" loading="lazy">
                        <div class="card-badge" th:if="${series.imdbRating != null}">
                            ★ <span th:text="${#numbers.formatDecimal(series.imdbRating, 1, 1)}">0.0</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title" th:text="${series.title}">Название</h3>
                        <div class="card-meta">
                            <span th:text="${series.genre}">Жанр</span>
                            <span th:text="${series.year}">2024</span>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</section>

<section class="section section-dark">
    <div class="container">
        <div class="section-header">
            <h2>Новинки</h2>
            <a th:href="@{/series}" class="link-all">Все сериалы →</a>
        </div>
        <div class="cards-grid">
            <div th:each="series : ${latest}" class="card">
                <a th:href="@{/series/{id}(id=${series.id})}">
                    <div class="card-poster">
                        <img th:src="${series.posterUrl != null ? series.posterUrl : '/images/placeholder.jpg'}"
                             th:alt="${series.title}" loading="lazy">
                        <div class="card-badge new-badge">NEW</div>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title" th:text="${series.title}">Название</h3>
                        <div class="card-meta">
                            <span th:text="${series.genre}">Жанр</span>
                            <span th:text="${series.year}">2024</span>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</section>

<footer class="footer">
    <div class="footer-inner">
        <span class="logo">Сериалы на<span>ЧД</span></span>
        <p>© 2026 Сериалы на ЧД</p>
    </div>
</footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>

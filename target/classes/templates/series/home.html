<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сериалы на ЧД — Series on Black Day</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<nav class="navbar">
    <div class="nav-inner">
        <a th:href="@{/}" class="logo">Series on <span>Black Day</span></a>
        <div class="nav-links">
            <a th:href="@{/series}">Каталог</a>
        </div>
        <div class="nav-auth">
            <div sec:authorize="isAnonymous()">
                <a th:href="@{/auth/login}" class="btn btn-ghost">Войти</a>
                <a th:href="@{/auth/register}" class="btn btn-primary">Регистрация</a>
            </div>
            <div sec:authorize="isAuthenticated()" class="user-menu">
                <span class="username" sec:authentication="name"></span>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="btn btn-ghost admin-link">Админ</a>
                <form th:action="@{/auth/logout}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-ghost">Выйти</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
        <h1>Лучшие сериалы<br><span>по моей личной рекомендации</span></h1>
        <p>Смотри, Оценивай, Пиши отзыв</p>
        <a th:href="@{/series}" class="btn btn-primary btn-lg">Смотреть каталог</a>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="section-header">
            <h2>Топ по рейтингу</h2>
            <a th:href="@{/series}" class="link-all">Все сериалы →</a>
        </div>
        <div class="cards-grid">
            <div th:each="series : ${topRated}" class="card">
                <a th:href="@{/series/{id}(id=${series.id})}">
                    <div class="card-poster">
                        <img th:src="${series.posterUrl != null ? series.posterUrl : '/images/placeholder.jpg'}"
                             th:alt="${series.title}" loading="lazy">
                        <div class="card-badge" th:if="${series.imdbRating != null}">
                            ★ <span th:text="${#numbers.formatDecimal(series.imdbRating, 1, 1)}">0.0</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title" th:text="${series.title}">Название</h3>
                        <div class="card-meta">
                            <span th:text="${series.genre}">Жанр</span>
                            <span th:text="${series.year}">2024</span>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</section>

<section class="section section-dark">
    <div class="container">
        <div class="section-header">
            <h2>Новинки</h2>
            <a th:href="@{/series}" class="link-all">Все сериалы →</a>
        </div>
        <div class="cards-grid">
            <div th:each="series : ${latest}" class="card">
                <a th:href="@{/series/{id}(id=${series.id})}">
                    <div class="card-poster">
                        <img th:src="${series.posterUrl != null ? series.posterUrl : '/images/placeholder.jpg'}"
                             th:alt="${series.title}" loading="lazy">
                        <div class="card-badge new-badge">NEW</div>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title" th:text="${series.title}">Название</h3>
                        <div class="card-meta">
                            <span th:text="${series.genre}">Жанр</span>
                            <span th:text="${series.year}">2024</span>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</section>

<footer class="footer">
    <div class="footer-inner">
        <span class="logo">Series on <span>Black Day</span></span>
        <a href="https://web.telegram.org/k/#@ssserialsblackday" target="_blank" class="btn-telegram">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
            </svg>
            Telegram
        </a>
    </div>
</footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>

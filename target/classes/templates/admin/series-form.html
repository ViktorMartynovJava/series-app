<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Series on Back Day Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .genre-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .genre-item {
            position: relative;
        }

        .genre-item input[type="checkbox"] {
            display: none;
        }

        .genre-item label {
            cursor: pointer;
            padding: 5px 14px;
            border: 1px solid #444;
            border-radius: 20px;
            font-size: 13px;
            transition: all 0.2s;
            user-select: none;
            display: inline-block;
        }

        .genre-item input[type="checkbox"]:checked + label {
            background-color: #e50914;
            color: white;
            border-color: #e50914;
        }

        /* Кнопка удаления жанра (×) */
        .genre-delete-btn {
            display: none;
            position: absolute;
            top: -5px;
            right: -5px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #666;
            color: white;
            border: none;
            font-size: 10px;
            line-height: 16px;
            text-align: center;
            cursor: pointer;
            padding: 0;
        }

        .genre-item:hover .genre-delete-btn {
            display: block;
        }

        /* Поле добавления нового жанра */
        .genre-add-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            align-items: center;
        }

        .genre-add-row input {
            flex: 1;
            max-width: 200px;
        }

        .genre-add-row button {
            white-space: nowrap;
        }

        .genre-error {
            font-size: 12px;
            color: #e50914;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-inner">
        <a th:href="@{/}" class="logo">Series on <span>Black Day</span></a>
        <div class="nav-links">
            <a th:href="@{/admin}" class="active admin-link">← Назад в панель</a>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 700px; padding-top: 40px;">

    <h1 th:text="${seriesId != null} ? 'Редактировать сериал' : 'Добавить сериал'">Сериал</h1>

    <form th:action="${seriesId != null} ? @{/admin/series/{id}/edit(id=${seriesId})} : @{/admin/series/new}"
          method="post" th:object="${seriesDto}" class="admin-form">

        <div class="form-group">
            <label>Название *</label>
            <input type="text" th:field="*{title}" class="input" placeholder="Введите название...">
            <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>

        <!-- ─── Жанры ─────────────────────────────────────────────────────── -->
        <div class="form-group">
            <label>Жанры</label>

            <!-- Список жанров из БД в виде чекбоксов -->
            <div class="genre-grid" id="genreGrid">
                <div th:each="genre : ${availableGenres}"
                     class="genre-item"
                     th:data-id="${genre.id}"
                     th:id="'genre-item-' + ${genre.id}">

                    <input type="checkbox"
                           th:id="'genre_' + ${genre.id}"
                           name="genres"
                           th:value="${genre.name}"
                           th:checked="${seriesDto.genres != null and seriesDto.genres.contains(genre.name)}"/>
                    <label th:for="'genre_' + ${genre.id}" th:text="${genre.name}"></label>

                    <!-- Кнопка удаления жанра из БД -->
                    <button type="button"
                            class="genre-delete-btn"
                            th:data-id="${genre.id}"
                            th:title="'Удалить ' + ${genre.name}"
                            onclick="deleteGenre(this)">×</button>
                </div>
            </div>

            <!-- Добавить новый жанр -->
            <div class="genre-add-row">
                <input type="text"
                       id="newGenreInput"
                       class="input"
                       placeholder="Новый жанр..."
                       maxlength="50">
                <button type="button" class="btn btn-ghost" onclick="addGenre()">+ Добавить</button>
            </div>
            <div class="genre-error" id="genreError"></div>
        </div>
        <!-- ─────────────────────────────────────────────────────────────────── -->

        <div class="form-row">
            <div class="form-group">
                <label>Год</label>
                <input type="number" th:field="*{year}" class="input" placeholder="2026">
            </div>
            <div class="form-group">
                <label>Страна</label>
                <input type="text" th:field="*{country}" class="input" placeholder="Россия, США...">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Оценка IMDb</label>
                <input type="number" th:field="*{imdbRating}" class="input" step="0.1" min="0" max="10" placeholder="8.5">
            </div>
            <div class="form-group">
                <label>Кол-во серий</label>
                <input type="number" th:field="*{episodesCount}" class="input" placeholder="12">
            </div>
        </div>

        <div class="form-group">
            <label>Статус</label>
            <select th:field="*{status}" class="input">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}">ONGOING</option>
            </select>
        </div>

        <div class="form-group">
            <label>URL постера</label>
            <input type="text" th:field="*{posterUrl}" class="input" placeholder="https://...">
        </div>

        <div class="form-group">
            <label>URL трейлера</label>
            <input type="text" th:field="*{trailerUrl}" class="input" placeholder="https://youtube.com/watch?v=...">
        </div>

        <div class="form-group">
            <label>URL видео</label>
            <input type="text" th:field="*{videoUrl}" class="input" placeholder="https://...">
        </div>

        <div class="form-group">
            <label>Описание</label>
            <textarea th:field="*{description}" class="input textarea" rows="5" placeholder="Краткое описание сериала..."></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a th:href="@{/admin}" class="btn btn-ghost">Отмена</a>
        </div>
    </form>

    <!-- Аудио блок (только при редактировании) -->
    <div th:if="${seriesId != null}" class="admin-form" style="margin-top: 24px; padding-bottom: 40px;">
        <h3 style="font-family: 'Raleway', sans-serif; font-weight: 800; margin-bottom: 4px;">Мое Личное Мнение🎙</h3>
        <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 16px;">
            Загрузи фаил в формате mp3 или WAV и он будет отображаться на странице с сериалом
        </p>

        <div th:if="${series != null and series.adminAudioUrl != null}" style="margin-bottom: 16px;">
            <p style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px;">Текущее аудио:</p>
            <audio controls style="width: 100%; accent-color: var(--accent);">
                <source th:src="${series.adminAudioUrl}" type="audio/mpeg">
            </audio>
            <form th:action="@{/admin/series/{id}/audio/delete(id=${seriesId})}" method="post" style="margin-top: 10px;">
                <button type="submit" class="btn btn-danger btn-sm">✕ Удалить аудио</button>
            </form>
        </div>

        <form th:action="@{/admin/series/{id}/audio(id=${seriesId})}"
              method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label>Фаил не больше 50 мб, ок бро?</label>
                <input type="file" name="file" accept="audio/*" class="input">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top: 8px;">Загрузить</button>
        </form>
    </div>

</div>

<script th:src="@{/js/main.js}"></script>
<script>
    // ─── Добавить жанр ────────────────────────────────────────────────────────
    async function addGenre() {
        const input = document.getElementById('newGenreInput');
        const errorEl = document.getElementById('genreError');
        const name = input.value.trim();

        errorEl.style.display = 'none';

        if (!name) {
            showGenreError('Введите название жанра');
            return;
        }

        try {
            const res = await fetch('/admin/genres', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });

            const data = await res.json();

            if (!res.ok) {
                showGenreError(data.error || 'Ошибка при добавлении');
                return;
            }

            // Добавляем чекбокс в сетку и сразу отмечаем
            appendGenreItem(data.id, data.name, true);
            input.value = '';

        } catch (e) {
            showGenreError('Ошибка соединения с сервером');
        }
    }

    // ─── Удалить жанр ────────────────────────────────────────────────────────
    async function deleteGenre(btn) {
        const id = btn.dataset.id;
        if (!confirm('Удалить этот жанр из базы данных?')) return;

        try {
            const res = await fetch('/admin/genres/' + id, { method: 'DELETE' });

            if (res.ok) {
                document.getElementById('genre-item-' + id).remove();
            } else {
                const data = await res.json();
                alert(data.error || 'Не удалось удалить жанр');
            }
        } catch (e) {
            alert('Ошибка соединения с сервером');
        }
    }

    // ─── Вспомогательные ─────────────────────────────────────────────────────
    function appendGenreItem(id, name, checked) {
        const grid = document.getElementById('genreGrid');

        const wrapper = document.createElement('div');
        wrapper.className = 'genre-item';
        wrapper.dataset.id = id;
        wrapper.id = 'genre-item-' + id;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = 'genre_' + id;
        checkbox.name = 'genres';
        checkbox.value = name;
        checkbox.checked = checked;

        const label = document.createElement('label');
        label.htmlFor = 'genre_' + id;
        label.textContent = name;

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'genre-delete-btn';
        delBtn.dataset.id = id;
        delBtn.title = 'Удалить ' + name;
        delBtn.textContent = '×';
        delBtn.onclick = function() { deleteGenre(this); };

        wrapper.appendChild(checkbox);
        wrapper.appendChild(label);
        wrapper.appendChild(delBtn);
        grid.appendChild(wrapper);
    }

    function showGenreError(msg) {
        const el = document.getElementById('genreError');
        el.textContent = msg;
        el.style.display = 'block';
    }

    // Enter в поле нового жанра → добавить
    document.getElementById('newGenreInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            addGenre();
        }
    });
</script>
</body>
</html>

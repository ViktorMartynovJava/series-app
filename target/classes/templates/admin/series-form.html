<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Series on Back Day Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .genre-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .genre-item input[type="checkbox"] {
            display: none;
        }

        .genre-item label {
            cursor: pointer;
            padding: 5px 14px;
            border: 1px solid #444;
            border-radius: 20px;
            font-size: 13px;
            transition: all 0.2s;
            user-select: none;
        }

        .genre-item input[type="checkbox"]:checked + label {
            background-color: #e50914;
            color: white;
            border-color: #e50914;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-inner">
        <a th:href="@{/}" class="logo">Series on <span>Black Day</span></a>
        <div class="nav-links">
            <a th:href="@{/admin}" class="active admin-link">← Назад в панель</a>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 700px; padding-top: 40px;">

    <h1 th:text="${seriesId != null} ? 'Редактировать сериал' : 'Добавить сериал'">Сериал</h1>

    <form th:action="${seriesId != null} ? @{/admin/series/{id}/edit(id=${seriesId})} : @{/admin/series/new}"
          method="post" th:object="${seriesDto}" class="admin-form">

        <div class="form-group">
            <label>Название *</label>
            <input type="text" th:field="*{title}" class="input" placeholder="Введите название...">
            <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>

        <div class="form-group">
            <label>Жанры</label>
            <div class="genre-grid">
                <div th:each="genre : ${availableGenres}" class="genre-item">
                    <input type="checkbox"
                           th:id="'genre_' + ${genre}"
                           name="genres"
                           th:value="${genre}"
                           th:checked="${seriesDto.genres != null and seriesDto.genres.contains(genre)}"/>
                    <label th:for="'genre_' + ${genre}" th:text="${genre}"></label>
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Год</label>
                <input type="number" th:field="*{year}" class="input" placeholder="2026">
            </div>
            <div class="form-group">
                <label>Страна</label>
                <input type="text" th:field="*{country}" class="input" placeholder="Россия, США...">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Оценка IMDb</label>
                <input type="number" th:field="*{imdbRating}" class="input" step="0.1" min="0" max="10" placeholder="8.5">
            </div>
            <div class="form-group">
                <label>Кол-во серий</label>
                <input type="number" th:field="*{episodesCount}" class="input" placeholder="12">
            </div>
        </div>

        <div class="form-group">
            <label>Статус</label>
            <select th:field="*{status}" class="input">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}">ONGOING</option>
            </select>
        </div>

        <div class="form-group">
            <label>URL постера</label>
            <input type="text" th:field="*{posterUrl}" class="input" placeholder="https://...">
        </div>

        <div class="form-group">
            <label>URL трейлера</label>
            <input type="text" th:field="*{trailerUrl}" class="input" placeholder="https://youtube.com/watch?v=...">
        </div>

        <div class="form-group">
            <label>URL видео</label>
            <input type="text" th:field="*{videoUrl}" class="input" placeholder="https://...">
        </div>

        <div class="form-group">
            <label>Описание</label>
            <textarea th:field="*{description}" class="input textarea" rows="5" placeholder="Краткое описание сериала..."></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a th:href="@{/admin}" class="btn btn-ghost">Отмена</a>
        </div>
    </form>


    <div th:if="${seriesId != null}" class="admin-form" style="margin-top: 24px; padding-bottom: 40px;">
        <h3 style="font-family: 'Raleway', sans-serif; font-weight: 800; margin-bottom: 4px;">Мое Личное Мнение🎙</h3>
        <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 16px;">
            Загрузи фаил в формате mp3 или WAV и он будет отображаться на странице с сериалом
        </p>

        <div th:if="${series != null and series.adminAudioUrl != null}" style="margin-bottom: 16px;">
            <p style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px;">Текущее аудио:</p>
            <audio controls style="width: 100%; accent-color: var(--accent);">
                <source th:src="${series.adminAudioUrl}" type="audio/mpeg">
            </audio>
            <form th:action="@{/admin/series/{id}/audio/delete(id=${seriesId})}" method="post" style="margin-top: 10px;">
                <button type="submit" class="btn btn-danger btn-sm">✕ Удалить аудио</button>
            </form>
        </div>

        <form th:action="@{/admin/series/{id}/audio(id=${seriesId})}"
              method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label>Фаил не больше 50 мб, ок бро?</label>
                <input type="file" name="file" accept="audio/*" class="input">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top: 8px;">Загрузить</button>
        </form>
    </div>

</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
